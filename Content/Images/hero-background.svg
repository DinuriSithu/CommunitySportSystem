<svg viewBox="0 0 1600 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="45%" stop-color="#00838f"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f57c00" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f57c00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="700" fill="url(#bg)"/>

  <!-- soft depth blobs -->
  <circle cx="220" cy="150" r="260" fill="url(#glow1)"/>
  <circle cx="1400" cy="550" r="320" fill="url(#glow1)"/>
  <circle cx="1250" cy="120" r="200" fill="url(#glow2)"/>

  <!-- faint running-track style curves -->
  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="6" fill="none">
    <ellipse cx="800" cy="900" rx="900" ry="420"/>
    <ellipse cx="800" cy="900" rx="760" ry="330"/>
  </g>

  <!-- thin diagonal court lines -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="2">
    <line x1="0" y1="80" x2="1600" y2="380"/>
    <line x1="0" y1="180" x2="1600" y2="480"/>
    <line x1="0" y1="620" x2="900" y2="0"/>
  </g>

  <!-- subtle ball silhouettes -->
  <g fill="#ffffff" fill-opacity="0.08">
    <circle cx="120" cy="560" r="60"/>
    <circle cx="1500" cy="200" r="45"/>
    <circle cx="980" cy="600" r="34"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" fill="none">
    <path d="M60 560 Q120 520 180 560 Q120 600 60 560 Z"/>
    <path d="M1455 200 Q1500 170 1545 200 Q1500 230 1455 200 Z"/>
  </g>
</svg>
